version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.react.rule=Host(`cicd-front.louisdev.fr`)"
      - "traefik.http.routers.react.entrypoints=websecure"
      - "traefik.http.routers.react.tls.certresolver=leresolver"
      - "traefik.http.services.react.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
