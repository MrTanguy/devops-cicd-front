name: Lint React App

on:
  push:
    branches: 
      - prod
  pull_request:
    branches:
      - prod

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🟢 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm i

      - name: 🧹 Run ESLint
        run: |
          npm run lint || true

